<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>てい | Official</title>
    <style>
        body {
            background-color: #050505;
            color: #d4af37;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 4px;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .links {
            margin-top: 30px;
        }
        .link-card {
            display: block;
            background: #111;
            border: 1px solid #222;
            color: #fff;
            padding: 16px;
            margin-bottom: 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .link-card:hover {
            border-color: #d4af37;
            background: #1a1a1a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>てい</h1>
        <div class="links">
            <a href="#" class="link-card">YouTube</a>
            <a href="#" class="link-card">Twitter / X</a>
            <a href="#" class="link-card">Kick</a>
            <a href="#" class="link-card">Portfolio</a>
        </div>
    </div>
</body>
</html>
