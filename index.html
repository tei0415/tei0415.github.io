<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>てい</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Language Switcher -->
    <div class="lang-switch-container">
        <button id="lang-btn">EN</button>
    </div>

    <main class="container">
        <!-- Profile Section -->
        <div class="profile-section">
            <img src="profile.jpg" alt="Tei" class="profile-img">
            <h1 class="title" data-ja="てい" data-en="TEI">てい</h1>
            <p class="subtitle" data-ja="モト テイスウ" data-en="Moto Teisuu">モト テイスウ</p>
        </div>

        <!-- Links Section -->
        <div class="links-section">
            <a href="#" class="link-btn" data-ja="𝕏 (Twitter)" data-en="𝕏 (Twitter)">𝕏 (Twitter)</a>
            <a href="#" class="link-btn" data-ja="Instagram" data-en="Instagram">Instagram</a>
            <a href="#" class="link-btn" data-ja="YouTube" data-en="YouTube">YouTube</a>
            <a href="mailto:tei0415.jp@gmail.com" class="link-btn" data-ja="✉ メール" data-en="✉ Email">✉ メール</a>
        </div>

        <!-- Fan Letter Section -->
        <div class="fan-letter-section">
            <h2 data-ja="ファンレター" data-en="Fan Letter">ファンレター</h2>
            <form id="fan-letter-form">
                <input type="text" id="sender-name" placeholder="名前" required>
                <textarea id="sender-message" rows="4" placeholder="メッセージ" required></textarea>
                <button type="submit" class="submit-btn" data-ja="送信する" data-en="Send">送信する</button>
            </form>
            <p id="thank-you-msg" class="hidden" data-ja="ありがとうございます！" data-en="Thank you!">ありがとうございます！</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
